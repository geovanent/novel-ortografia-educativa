name: novel

services:
  db:
    image: mariadb:10.6
    command: >
      --character-set-server=utf8
      --collation-server=utf8_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: admnovel
      MYSQL_DATABASE: novel
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/content.sql:/docker-entrypoint-initdb.d/02-content.sql:ro
      - ./database/demo.sql:/docker-entrypoint-initdb.d/03-demo.sql:ro
      - ./docker/02-app-user.sql:/docker-entrypoint-initdb.d/04-user.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-padmnovel"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: novel_app
      DB_PASSWORD: novel-local-development
      DB_NAME: novel
      BASE_URL: http://localhost:8080/
      # 'development' expoe erros do PHP ao visitante (index.php).
      CI_ENV: production
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
