# O .htaccess da raiz faz o roteamento para index.php; sem AllowOverride ele e ignorado.
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# index.php le $_SERVER['CI_ENV'], que o Apache so preenche se a variavel do
# ambiente do container for repassada explicitamente.
PassEnv CI_ENV

# Uploads não podem executar scripts, mesmo se um volume não tiver .htaccess.
<Directory /var/www/html/assets/img/uploads>
    Options -Indexes -ExecCGI
    <FilesMatch "\.(php[0-9]?|phtml|phar|cgi|pl|sh|html?|svg)$">
        Require all denied
    </FilesMatch>
</Directory>
